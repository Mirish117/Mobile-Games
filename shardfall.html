<style>
/* Layout: full-screen stage with the canvas on top. Touch pad sits below it in portrait and floats over it in landscape. Menus are full-screen panels over everything. */
:root{
  --night:#110d1c;
  --paper:#1b152b;
  --plum:#3b2656;
  --ember:#ffb347;
  --gold:#ffd24a;
  --hp:#d9524a;
  --xp:#7bd8ff;
  --bone:#f3e7d3;
  --moss:#7bd48f;
  --ink:#0d0a14;
  --line:rgba(243,231,211,.2);
  --f-display:'Silkscreen',ui-monospace,'Courier New',monospace;
  --f-body:'Chakra Petch',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--night)}
body{height:100%;margin:0;background:var(--night);color:var(--bone);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;touch-action:none}
button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 14px;pointer-events:none;font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 0 rgba(13,10,20,.85)}
.bars{width:min(44vw,200px);display:flex;flex-direction:column;gap:4px}
.hudtxt{display:flex;justify-content:space-between;gap:8px}
.bar{height:10px;background:rgba(13,10,20,.72);border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;background:var(--hp);transform-origin:left;transform:scaleX(1)}
#xpBar{height:5px}
#xpBar i{background:var(--xp)}
.rgt{display:flex;align-items:center;gap:8px;pointer-events:auto}
.gold{display:flex;align-items:center;gap:5px;color:var(--gold);margin-right:2px}
.ico{display:inline-block;flex:none}
.ico.coin{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #c18a1c}
.sq{position:relative;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:rgba(17,13,28,.6);display:grid;place-items:center;padding:0}
.sq svg{width:18px;height:18px;fill:var(--bone)}
.sq b{position:absolute;right:-4px;bottom:-5px;min-width:16px;padding:1px 3px;border-radius:8px;background:var(--hp);color:#fff;font-size:10px;line-height:12px;text-align:center}
#bSound.off .wave{display:none}
#bSound .slash{display:none}
#bSound.off .slash{display:inline}

#boss{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:min(340px,calc(100% - 32px));text-align:center;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-shadow:0 2px 0 rgba(13,10,20,.85);pointer-events:none}
#boss .bar{height:9px;margin-top:4px}
#toast{position:absolute;left:50%;top:92px;transform:translateX(-50%);max-width:calc(100% - 32px);font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:6px 10px;background:rgba(13,10,20,.78);border:1px solid var(--line);pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

#dlg{position:absolute;left:12px;right:12px;bottom:12px;z-index:3;display:flex;flex-direction:column;gap:8px;touch-action:manipulation}
.dbox{display:flex;gap:10px;padding:12px;background:rgba(20,15,34,.94);border:1px solid var(--line);border-radius:6px;box-shadow:0 0 0 3px rgba(13,10,20,.55)}
.dport{flex:none;width:44px;height:44px;border-radius:4px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;color:#14101f}
.dtxt{min-width:0;flex:1}
#dName{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
#dText{margin:0;font-size:15px;line-height:1.4;min-height:42px}
#dMore{font-family:var(--f-display);font-size:10px;color:rgba(243,231,211,.6);text-align:right;margin-top:2px}
#dChoices{display:flex;flex-direction:column;gap:6px}

#pad{flex:none;height:clamp(150px,26vh,200px);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 14px;background:linear-gradient(#17112a,#0e0a18);border-top:1px solid rgba(243,231,211,.1);touch-action:none}
.dpad{display:flex;gap:10px}
.act{display:grid;grid-template-columns:repeat(2,64px);grid-template-rows:repeat(2,64px);gap:10px}
.pb{position:relative;overflow:hidden;width:64px;height:64px;border-radius:18px;border:1px solid var(--line);background:rgba(243,231,211,.07);display:grid;place-items:center;padding:0;font-family:var(--f-display);font-size:10px;letter-spacing:.08em}
.pb span{position:relative;pointer-events:none}
.pb svg{position:relative;width:26px;height:26px;fill:var(--bone);pointer-events:none}
.pb .cd{position:absolute;left:0;right:0;bottom:0;height:100%;background:rgba(13,10,20,.66);transform-origin:bottom;transform:scaleY(var(--cd,0));pointer-events:none}
.pb.down{background:rgba(255,179,71,.3);border-color:var(--ember)}
#bAtk{border-color:rgba(255,122,61,.75);background:rgba(255,122,61,.16);color:#ffb08a}
#bSkill{border-color:rgba(168,130,255,.75);background:rgba(168,130,255,.14);color:#cdb6ff}
#bPet{border-color:rgba(123,212,143,.7);background:rgba(123,212,143,.12);color:#a9e8b6}
#bPet.none{opacity:.35}
#bJ{border-color:rgba(255,179,71,.65);background:rgba(255,179,71,.13);color:var(--ember)}
@media (orientation:landscape){
  #pad{position:absolute;left:0;right:0;bottom:0;height:auto;padding:0 max(18px,3vw) 14px;background:none;border:0;pointer-events:none;align-items:flex-end}
  .pb{pointer-events:auto;width:58px;height:58px;border-radius:16px;background:rgba(243,231,211,.1)}
  .act{grid-template-columns:repeat(2,58px);grid-template-rows:repeat(2,58px)}
  #dlg{left:170px;right:170px}
}
#app.talk #pad{visibility:hidden}

#screen{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:14px 12px;background:rgba(10,7,18,.78)}
#screen.clear{background:linear-gradient(rgba(10,7,18,.2),rgba(10,7,18,.82))}
#screen button{touch-action:manipulation}
.panel{width:min(100%,520px);max-height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;padding:18px 16px 16px;background:rgba(24,18,38,.94);border:1px solid var(--line);border-radius:6px;box-shadow:0 0 0 3px rgba(13,10,20,.6),0 18px 50px rgba(0,0,0,.5)}
.panel.center{text-align:center;align-items:stretch}
.kicker{font-family:var(--f-display);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(243,231,211,.65)}
h1,h2,h3,p{margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,11vw,52px);line-height:1;letter-spacing:.04em;color:var(--ember);text-shadow:3px 3px 0 var(--plum);text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--ember);text-wrap:balance}
h3{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.sub{font-size:15px;line-height:1.45;color:rgba(243,231,211,.85);text-wrap:balance}
.small{font-size:13px;line-height:1.45;color:rgba(243,231,211,.7)}
.btn{width:100%;box-sizing:border-box;padding:13px 14px;border:0;border-radius:6px;background:var(--ember);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 4px 0 #b36a1a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b36a1a}
.btn.alt{background:transparent;color:var(--bone);border:1px solid var(--line);box-shadow:none}
.btn.alt:active{transform:none;background:rgba(243,231,211,.1)}
.btn.sm{width:auto;padding:8px 10px;font-size:11px;box-shadow:0 3px 0 #b36a1a}
.btn[disabled]{opacity:.4;pointer-events:none}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:340px){.cards{grid-template-columns:1fr}}
.card{min-width:0;text-align:left;padding:12px;border:1px solid var(--line);border-radius:6px;background:rgba(243,231,211,.05);display:flex;flex-direction:column;gap:6px}
button.card{width:100%;box-sizing:border-box;font:inherit;color:inherit}
.card.sel{border-color:var(--ember);background:rgba(255,179,71,.12)}
.card.hero{border-color:rgba(123,216,255,.6)}
.card.villain{border-color:rgba(194,123,255,.6)}
.meter{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;font-size:11px;color:rgba(243,231,211,.7)}
.meter i{display:block;height:5px;background:rgba(243,231,211,.12)}
.meter i b{display:block;height:100%;background:var(--ember)}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:2px}
.tab{flex:none;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.tab.on{background:var(--ember);border-color:var(--ember);color:var(--ink)}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;min-height:0;display:flex;flex-direction:column;gap:10px;padding-right:2px}
.row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:6px;background:rgba(243,231,211,.04)}
.row .grow{min-width:0;flex:1}
.row .grow b{display:block;font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.row .grow span{font-size:13px;line-height:1.35;color:rgba(243,231,211,.75)}
.pips{display:flex;gap:3px;margin-top:5px}
.pips i{width:10px;height:6px;background:rgba(243,231,211,.15)}
.pips i.on{background:var(--ember)}
.dot{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:13px;color:#14101f}
.stat{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--f-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.stat span:nth-child(2){color:var(--xp)}
.tag{font-family:var(--f-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);border-radius:4px;color:rgba(243,231,211,.75)}
.tag.ok{color:var(--moss);border-color:rgba(123,212,143,.5)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<style>:root{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Shardfall Chronicles game"></canvas>
    <div id="hud" hidden>
      <div class="bars">
        <div class="hudtxt"><span id="hLv">Lv 1</span><span id="hHp">60/60</span></div>
        <div class="bar" id="hpBar"><i></i></div>
        <div class="bar" id="xpBar"><i></i></div>
      </div>
      <div class="rgt">
        <div class="gold"><span class="ico coin"></span><span id="hGold">0</span></div>
        <button id="bPot" class="sq" type="button" aria-label="Drink potion"><svg viewBox="0 0 24 24"><path d="M9 3h6v2l-1 1v3.2l4.6 8.1A2.5 2.5 0 0 1 16.4 21H7.6a2.5 2.5 0 0 1-2.2-3.7L10 9.2V6L9 5V3z"/></svg><b id="hPot">0</b></button>
        <button id="bSound" class="sq" type="button" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path class="wave" d="M15 8.5a5 5 0 0 1 0 7l1.4 1.4a7 7 0 0 0 0-9.8L15 8.5z"/><path class="slash" d="M16 9l5 6-1.3 1.1-5-6z"/></svg></button>
        <button id="bPause" class="sq" type="button" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
      </div>
    </div>
    <div id="boss" hidden><div id="bossName"></div><div class="bar"><i id="bossFill"></i></div></div>
    <div id="toast"></div>
    <div id="dlg" hidden>
      <div class="dbox" id="dBox">
        <div class="dport" id="dPort">?</div>
        <div class="dtxt"><div id="dName"></div><p id="dText"></p><div id="dMore">Tap to continue</div></div>
      </div>
      <div id="dChoices"></div>
    </div>
  </div>
  <div id="pad">
    <div class="dpad">
      <button class="pb" data-k="left" type="button" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M16 4v16L5 12z"/></svg></button>
      <button class="pb" data-k="right" type="button" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="M8 4v16l11-8z"/></svg></button>
    </div>
    <div class="act">
      <button id="bSkill" class="pb" data-k="skill" type="button" aria-label="Class skill"><i class="cd"></i><span>SKILL</span></button>
      <button id="bPet" class="pb none" data-k="pet" type="button" aria-label="Companion command"><i class="cd"></i><span>PET</span></button>
      <button id="bJ" class="pb" data-k="jump" type="button" aria-label="Jump"><span>JUMP</span></button>
      <button id="bAtk" class="pb" data-k="attack" type="button" aria-label="Attack"><span>ATK</span></button>
    </div>
  </div>
  <div id="screen" hidden></div>
</div>

<script>
(function(){
'use strict';
/* ================= core: utils, audio, input ================= */
const T=16, ROWS=18, STEP=1/120;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=Math.random;
function lsGet(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(a,b){let h=Math.imul(a,374761393)+Math.imul(b,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return(h^h>>>16)>>>0;}
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

const cv=$('c'), ctx=cv.getContext('2d'), stage=$('stage'), app=$('app');

/* ---------- audio ---------- */
let AC=null,muted=lsGet('shardfall.muted',false);
function audioInit(){
  try{
    if(AC){if(AC.state==='suspended')AC.resume();return;}
    const C=window.AudioContext||window.webkitAudioContext;
    if(C)AC=new C();
  }catch(e){}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted)return;
  try{
    const t=AC.currentTime+(delay||0),o=AC.createOscillator(),gn=AC.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
    gn.gain.setValueAtTime(vol||.05,t);
    gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(gn);gn.connect(AC.destination);
    o.start(t);o.stop(t+dur+.03);
  }catch(e){}
}
const sfx={
  jump:()=>tone(280,560,.13,'square',.035),
  slash:()=>tone(520,160,.1,'sawtooth',.04),
  stab:()=>tone(700,300,.07,'square',.035),
  bolt:()=>tone(240,720,.16,'sawtooth',.035),
  arrow:()=>tone(900,400,.08,'triangle',.05),
  hit:()=>tone(180,70,.1,'square',.06),
  clink:()=>tone(1400,900,.07,'triangle',.05),
  hurt:()=>tone(300,80,.25,'sawtooth',.06),
  die:()=>tone(420,50,.6,'sawtooth',.06),
  kill:()=>{tone(300,120,.12,'square',.05);tone(200,80,.14,'square',.04,.05);},
  coin:()=>{tone(1100,1100,.05,'square',.025);tone(1650,1650,.08,'square',.025,.05);},
  chest:()=>{[523,659,784].forEach((f,i)=>tone(f,f,.1,'square',.04,i*.07));},
  skill:()=>tone(150,520,.3,'sawtooth',.05),
  nova:()=>{tone(110,440,.35,'sawtooth',.06);tone(660,220,.3,'triangle',.04,.05);},
  dash:()=>tone(900,200,.18,'sawtooth',.04),
  pet:()=>{tone(500,800,.1,'triangle',.05);tone(800,1000,.12,'triangle',.05,.08);},
  heal:()=>{[660,880,1100].forEach((f,i)=>tone(f,f,.12,'triangle',.05,i*.08));},

/* tiny generative music: slow minor arpeggio, root per place */
let musicRoot=0,mStep=0,mInt=null;
function setMusic(root){
  musicRoot=root;
  if(!mInt)mInt=setInterval(()=>{
    if(!AC||muted||!musicRoot||document.hidden)return;
    const deg=[0,3,7,10,12,10,7,3];
    const f=musicRoot*Math.pow(2,deg[mStep%8]/12);
    tone(f,f,.5,'triangle',.016);
    if(mStep%16===0)tone(musicRoot/2,musicRoot/2,1.6,'sine',.03);
    if(mStep%16===8)tone(musicRoot/2*Math.pow(2,-5/12),musicRoot/2*Math.pow(2,-5/12),1.6,'sine',.03);
    mStep++;
  },400);
}

const padEl=$('pad'),padBtns=Array.prototype.slice.call(padEl.querySelectorAll('button'));
function syncInput(){for(const k in input)input[k]=keys[k]||touchHeld[k];}
function pressEdge(k){if(k==='jump'||k==='skill'||k==='pet')edge[k]=true;}
function releaseAll(){
  for(const k in keys)keys[k]=false;

  touches.clear();
  edge.jump=edge.skill=edge.pet=edge.potion=false;

}
function hitBtn(x,y){
  for(const b of padBtns){
    const r=b.getBoundingClientRect();
    if(x>=r.left-8&&x<=r.right+8&&y>=r.top-8&&y<=r.bottom+8)return b.dataset.k;
  }
  return null;
}
function applyTouches(){
  const held={left:false,right:false,jump:false,attack:false,skill:false,pet:false};
  touches.forEach(k=>{if(k)held[k]=true;});
  for(const k in held)if(held[k]&&!touchHeld[k])pressEdge(k);
  touchHeld=held;
  padBtns.forEach(b=>b.classList.toggle('down',!!held[b.dataset.k]));
  syncInput();
}
padEl.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();touches.set(e.pointerId,hitBtn(e.clientX,e.clientY));applyTouches();});

  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(solid(tx,ty)){
      if(e.vy>0){e.y=ty*T-e.h;e.onGround=true;}else if(e.vy<0){e.y=(ty+1)*T;}
      e.vy=0;
      return;
    }
  }
}
/* move a walking body one step; returns true if it hit a wall */
function moveBody(e,dt){
  e.x+=e.vx*dt;
  const wall=collideX(e);
  e.onGround=false;
  e.y+=e.vy*dt;
  collideY(e);
  return wall;
}

function genStage(si){
  const cfg=STAGES[si],r=mulberry32(cfg.id*911+17);
  const GW=cfg.W+110,g=[];
  for(let i=0;i<ROWS;i++){const row=[];for(let c=0;c<GW;c++)row.push('.');g.push(row);}
  const lv={g,W:0,cfg,si,theme:THEMES[cfg.theme],enemies:[],coins:[],chests:[],pots:[],objs:[],checks:[],decor:[],projs:[],loot:[],goal:null,arena:null,spawn:null,spawnPt:null,fx:[],texts:[]};
  let top=14,x=12,lastCP=0,rescueDone=!cfg.rescue,npcDone=!cfg.npc;
  const fill=(x0,x1,t)=>{for(let c=x0;c<x1;c++)for(let rr=t;rr<ROWS;rr++)g[rr][c]='#';};
  const coin=(cx,cy,v)=>lv.coins.push({x:cx,y:cy,v:v||1,st:true,vx:0,vy:0,ph:r()*6});
  const arc=(xa,xb,by,hh,n)=>{for(let i=0;i<n;i++){const t=n===1?.5:i/(n-1);coin(xa+(xb-xa)*t,by-hh*Math.sin(Math.PI*t),1);}};
  const addEnemy=(type,ex,ey)=>lv.enemies.push(mkEnemy(type,ex,ey,si));
  const addChest=(cx,cy)=>lv.chests.push({x:cx-7,y:cy-10,w:14,h:10,open:false});
  const addPot=(cx,cy)=>lv.pots.push({x:cx-5,y:cy-10,w:10,h:10,broken:false});
  const addDecor=(x0,len)=>{
    const kind={pine:'bush',ruins:'banner',pillars:'torch',jagged:'rock',gate:'crystal'}[lv.theme.style];
    if(r()<.55)lv.decor.push({kind,x:(x0+1+Math.floor(r()*(len-2)))*T+8,y:top*T});
  };
  fill(0,12,top);
  lv.spawn={x:3*T,y:top*T-18};

  function placeEnemies(x0,len){
    if(x0<24)return;
    if(r()<cfg.dens){
      const type=cfg.ground[Math.floor(r()*cfg.ground.length)];
      const need={slime:5,skeleton:6,archer:6,knight:7}[type]||5;
      if(len>=need){
        const n=(len>=9&&r()<cfg.dens*.6)?2:1;
        for(let i=0;i<n;i++)addEnemy(type,(x0+2+Math.floor(r()*(len-4)))*T,top*T-ENEMY[type].h);
      }
    }
    if(cfg.air.length&&r()<cfg.dens*.5){
      const type=cfg.air[Math.floor(r()*cfg.air.length)];
      addEnemy(type,(x0+len/2)*T,top*T-(type==='bat'?58:48));
    }
  }
  function flatRun(len,safe){
    fill(x,x+len,top);
    const x0=x;
    let deco='';
    if(!safe&&x0>22){
      if(x0-lastCP>=34&&len>=6){lv.checks.push({x:(x0+1)*T+8,y:top*T,on:false});lastCP=x0;deco='cp';}
      else if(cfg.spikes&&len>=7&&r()<.3){
        const sw=1+(r()<.4?1:0);
        const c0=x0+2+Math.floor(r()*(len-5-sw+1));
        for(let c=c0;c<c0+sw;c++)g[top-1][c]='^';
        arc(c0*T-8,(c0+sw)*T+8,top*T-14,20,3);
        deco='spike';
      }
    }
    if(!safe&&deco!=='spike'&&deco!=='cp')placeEnemies(x0,len);
    if(deco!=='spike'){
      if(!safe&&x0>16&&len>=5&&r()<.2)addChest((x0+len-2)*T+8,top*T);
      else if(r()<.4)addPot((x0+1+Math.floor(r()*(len-2)))*T+8,top*T);
      const n=3+Math.floor(r()*3);
      arc(x0*T+14,(x0+len)*T-14,top*T-14,10,n);
    }
    addDecor(x0,len);
    x+=len;
  }

  const endX=cfg.W;
  while(x<endX){
    const prog=x/endX;
    if(!npcDone&&prog>=cfg.npc.at){
      const x0=x;flatRun(7,true);
      lv.objs.push({kind:'npc',id:cfg.npc.id,scene:'npc_'+cfg.npc.id,x:(x0+3)*T,y:top*T,w:14,h:20,done:false});
      npcDone=true;continue;
    }
    if(!rescueDone&&prog>=cfg.rescue.at){
      const rs=cfg.rescue,owned=S&&S.pets[rs.id];
      if(rs.kind==='flat'){
        const x0=x;flatRun(9,true);
        const cx=(x0+4)*T+8;
        if(owned)addChest(cx,top*T);
        else lv.objs.push({kind:'rescue',id:rs.id,scene:'rescue_'+rs.id,x:cx-7,y:top*T-14,w:14,h:14,done:false});
      }else{
        const n=rs.n,len=10+3*n,x0=x;
        fill(x,x+len,top);
        let px=x0+3,lastRow=top,lastPx=px;
        for(let i=0;i<n;i++){
          const row=top-2*(i+1);
          for(let c=px;c<px+2;c++)g[row][c]='B';
          lastRow=row;lastPx=px;
          if(i===1)addChest((px+1)*T,row*T);
          arc(px*T-4,(px+2)*T+4,row*T-12,8,2);
          px+=3;
        }
        const cx=(lastPx+1)*T;
        if(owned)addChest(cx,lastRow*T);
        else lv.objs.push({kind:'rescue',id:rs.id,scene:'rescue_'+rs.id,x:cx-7,y:lastRow*T-14,w:14,h:14,done:false});
        lv.checks.push({x:(x0+1)*T+8,y:top*T,on:false});lastCP=x0;
        addDecor(x0,len);
        x+=len;
      }
      rescueDone=true;continue;
    }
    const roll=r(),pIsl=cfg.id>=2?.2:.08;
    if(roll<.27){
      const w=2+(r()<.3+cfg.id*.05?1:0);
      arc(x*T-6,(x+w)*T+6,top*T-14,22,3);
      x+=w;
    }else if(roll<.53){
      const opts=[-2,-1,1,2].filter(d=>top+d>=10&&top+d<=15);
      top+=opts[Math.floor(r()*opts.length)];
    }else if(roll<.53+pIsl){
      const n=2+Math.floor(r()*(1+Math.min(2,Math.floor(cfg.id/2))));
      let gapw=2,h=r()<.5?2:1,cx=x;
      for(let i=0;i<n;i++){
        cx+=gapw;
        const iw=2+(r()<.4?1:0);
        for(let c=cx;c<cx+iw;c++)g[top-h][c]='B';
        coin(cx*T+iw*T/2,(top-h)*T-14,2);
        cx+=iw;
        gapw=r()<.5?2:3;
        let nh=Math.max(1,Math.min(3,h+Math.floor(r()*3)-1));
        if(gapw===3&&nh>h)nh=h;
        h=nh;
      }
      x=cx+gapw;
    }
    flatRun(4+Math.floor(r()*5),false);
  }

  if(cfg.boss){
    lv.checks.push({x:(x+2)*T+8,y:top*T,on:false});
    flatRun(8,true);
    const x0=x;
    fill(x0,x0+38,top);
    for(let rr=Math.max(0,top-13);rr<top;rr++){g[rr][x0+36]='B';g[rr][x0+37]='B';}
    lv.arena={x0,x1:x0+36,doorCol:x0,top,trigX:(x0+4)*T,triggered:false,done:false,boss:null,bossSpawn:{x:(x0+28)*T,y:top*T-30}};
    for(let c=x0+8;c<x0+34;c+=7)lv.decor.push({kind:'crystal',x:c*T+8,y:top*T});
    lv.goal={x:(x0+32)*T,y:top*T,hit:false,visible:false};
    lv.W=x0+40;
  }else{
    fill(x,x+20,top);
    lv.goal={x:(x+10)*T+8,y:top*T,hit:false,visible:true};
    lv.W=x+20;
  }
  lv.g=g.map(row=>row.slice(0,lv.W));
  lv.spawnPt={x:lv.spawn.x,y:lv.spawn.y};
  return lv;
}

const G={state:'title',arc:'hero',stageIdx:0,t:0,timer:0,shake:0,anim:0,kills:0,goldRun:0,xpRun:0,lostGold:0};

function newSave(arc,cls){
  return {v:1,arc,cls,lvl:1,xp:0,sp:0,gold:0,potions:2,weapon:0,armor:0,ranks:{},pets:{},bond:{},equip:null,mercy:0,flags:{},seen:{},clear:[false,false,false,false,false]};
}
function saveGame(){if(S)lsSet('shardfall.save',S);}
function xpNeed(l){return 20+l*l*5;}

function computeStats(){
  const c=CLASSES[S.cls];
  const st={maxHp:c.hp+(S.lvl-1)*7+FORGE.armor[S.armor].hp,dmg:c.dmg*(1+(S.lvl-1)*.07)*(1+FORGE.weapon[S.weapon].b),speed:c.speed,jump:c.jump,crit:.05,atkCd:c.atkCd,skillCd:c.skill.cd,skillPow:1,armor:0,lifeKill:0,gold:0,petPow:1,petCd:1,volley:3,dj:c.dj?1:0};
  const add={dmg:0,speed:0,crit:0,atkCd:0,skillCd:0,skillPow:0,armor:0,lifeKill:0,gold:0,petPow:0,petCd:0,volley:0,hp:0,dj:0};
  const nodes=UNI.concat(NODES[S.cls]);
  for(const n of nodes){
    const rk=S.ranks[n.id]||0;
    if(!rk)continue;
    for(const k in n.eff)add[k]+=n.eff[k]*rk;
  }
  st.maxHp+=add.hp;
  st.dmg*=1+add.dmg;
  st.speed*=1+add.speed;
  st.crit+=add.crit;
  st.atkCd*=Math.max(.4,1+add.atkCd);
  st.skillCd*=Math.max(.4,1+add.skillCd);
  st.skillPow+=add.skillPow;
  st.armor=Math.min(.6,add.armor);
  st.lifeKill=add.lifeKill;
  st.gold=add.gold;
  st.petPow+=add.petPow;
  st.petCd=Math.max(.4,1+add.petCd);
  st.volley+=add.volley;
  st.dj=(st.dj||add.dj>0)?1:0;
  if(S.mercy>=2)st.maxHp=Math.round(st.maxHp*1.1);
  if(S.mercy<=-2)st.dmg*=1.1;
  if(S.equip==='fox')st.gold+=.2;
  st.maxHp=Math.round(st.maxHp);
  return st;
}
function refreshStats(){ST=computeStats();if(P)P.hp=Math.min(P.hp,ST.maxHp);}

/* ---------- combat ---------- */
function playerDmg(mult){

function shoot(owner,x,y,vx,vy,o){

function breakPot(pt){

function spawnCoins(x,y,total){

function gainGold(v){
  const g=Math.max(1,Math.round(v*(1+ST.gold)));
  S.gold+=g;G.goldRun+=g;
  if(G.anim-(gainGold.t||0)>.06){sfx.coin();gainGold.t=G.anim;}

function gainXp(n){

  }
}
function hurtPlayer(d,fromX){
  if(P.inv>0||P.dead||G.state!=='play'||P.dash)return;
  d=Math.max(1,Math.round(d*(1-ST.armor)));
  P.hp-=d;P.inv=.9;P.hurt=.25;
  const dir=P.x+5<fromX?-1:1;
  P.vx=dir*130;P.vy=-170;P.onGround=false;P.dash=null;
  floatText(P.x+5,P.y,'-'+d,'#ff6b5a');

  burst(6,P.x+5,P.y+8,'#d9524a',{speed:70,life:.4});
  if(P.hp<=0)playerDie();
}
function damageEnemy(e,d,o){
  if(e.dead)return;
  o=o||{};
  if(e.type==='knight'&&!e.stun&&o.from!==undefined&&((o.from-(e.x+e.w/2))*e.dir>0)){
    d=Math.max(1,Math.round(d*.3));
    e.hp-=d;e.hurt=.05;
    sfx.clink();floatText(e.x+e.w/2,e.y-4,'block','#9fb3d1');
    if(e.hp<=0)killEnemy(e);
    return;
  }
  if(e.type==='boss'&&S.flags.tip)d=Math.round(d*1.1);
  e.hp-=d;e.hurt=.12;
  if(e.type!=='boss'){
    const dir=(e.x+e.w/2)>(o.from!==undefined?o.from:P.x+5)?1:-1;
    e.kvx=dir*(o.kb||80);
    if(e.type==='skeleton'||e.type==='slime'||e.type==='archer'||e.type==='knight')e.vy=Math.min(e.vy,-60);
  }
  if(o.stun&&e.type!=='boss')e.stun=Math.max(e.stun,o.stun);
  floatText(e.x+e.w/2,e.y-4,(o.crit?'!':'')+d,o.crit?'#ffe27a':'#ffffff');
  sfx.hit();
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.dead)return;
  e.dead=true;e.dying=.35;
  G.kills++;
  sfx.kill();
  const cx=e.x+e.w/2,cy=e.y+e.h/2;
  burst(e.type==='boss'?40:12,cx,cy,e.type==='slime'?'#6fd26f':'#d8d0e8',{speed:100,life:.6,size:2});
  const g0=e.gold[0]+Math.floor(Math.random()*(e.gold[1]-e.gold[0]+1));
  if(g0>0)spawnCoins(cx,cy,g0);
  gainXp(e.xp);
  if(S.equip){S.bond[S.equip]=(S.bond[S.equip]||0)+1;const nb=bondLevel(S.equip);if(nb!==killEnemy.lastBond&&nb>1&&BOND_AT.indexOf((S.bond[S.equip]))>=0){toast(PETS[S.equip].name+' bond level '+nb);}killEnemy.lastBond=nb;}
  if(ST.lifeKill&&P.hp<ST.maxHp){P.hp=Math.min(ST.maxHp,P.hp+ST.lifeKill);floatText(P.x+5,P.y-4,'+'+ST.lifeKill,'#7bd48f');}
  if((e.type==='skeleton'||e.type==='knight'||e.type==='wisp')&&Math.random()<.14)LV.loot.push({kind:'potion',x:cx,y:e.y,vy:-90,t:0});
  if(e.type==='boss')bossDefeated(e);
}
function hitRect(rect,mult,o){
  let n=0;
  for(const e of LV.enemies){
    if(e.dead||!aabb(rect,e))continue;
    const pd=playerDmg(mult);
    damageEnemy(e,pd.d,{crit:pd.crit,kb:o.kb,stun:o.stun,from:o.from});
    n++;
  }
  for(const pt of LV.pots)if(!pt.broken&&aabb(rect,pt))breakPot(pt);
  return n;
}
function aoe(cx,cy,r,mult,o){
  let n=0;
  for(const e of LV.enemies){
    if(e.dead)continue;
    const dx=e.x+e.w/2-cx,dy=e.y+e.h/2-cy,rr=r+e.w/2;
    if(dx*dx+dy*dy<=rr*rr){
      const pd=playerDmg(mult);
      damageEnemy(e,pd.d,{crit:pd.crit,kb:o.kb,stun:o.stun,from:cx});
      n++;
    }
  }
  for(const pt of LV.pots){const dx=pt.x+5-cx,dy=pt.y+5-cy;if(!pt.broken&&dx*dx+dy*dy<=(r+6)*(r+6))breakPot(pt);}
  return n;
}

function doAttack(){
  const p=P,cls=S.cls,f=p.face;
  p.atkCd=ST.atkCd;p.atkT=.18;

  }else if(cls==='mage'){
    const pd=playerDmg(1);
    shoot('p',p.x+5+f*6,p.y+6,f*230,0,{dmg:pd.d,crit:pd.crit,w:7,h:7,life:1.3,col:'#ff9a5a',kind:'fire'});
    sfx.bolt();
  }else{
    const pd=playerDmg(1);
    shoot('p',p.x+5+f*6,p.y+8,f*340,0,{dmg:pd.d,crit:pd.crit,w:9,h:3,life:.9,grav:25,col:'#e8d8a0',kind:'arrow'});
    sfx.arrow();
  }
}
function doSkill(){
  const p=P,cls=S.cls,f=p.face;
  p.skillCd=ST.skillCd;
  if(cls==='knight'){
    const r=38*(1+(ST.skillPow-1)*.4);
    aoe(p.x+5,p.y+16,r,1.8*ST.skillPow,{kb:150,stun:1.2});
    LV.fx.push({k:'ring',x:p.x+5,y:p.y+16,r,t:.3,max:.3,col:'#e0c36a'});
    burst(14,p.x+5,p.y+17,'#e0c36a',{speed:90,life:.4,size:2});
    G.shake=.15;sfx.slam();
  }else if(cls==='mage'){
    const r=54*(1+(ST.skillPow-1)*.4);
    aoe(p.x+5,p.y+9,r,2.4*ST.skillPow,{kb:200,stun:.4});
    LV.fx.push({k:'ring',x:p.x+5,y:p.y+9,r,t:.4,max:.4,col:'#b79cff'});
    burst(24,p.x+5,p.y+9,'#b79cff',{speed:130,life:.5,g:0,size:2});
    sfx.nova();
  }else if(cls==='rogue'){
    p.dash={t:.17,dir:f,hit:[]};
    p.inv=Math.max(p.inv,.3);
    sfx.dash();
  }else{
    const n=ST.volley;
    for(let i=0;i<n;i++){
      const a=-1.05+.9*(n===1?.5:i/(n-1));
      const pd=playerDmg(.9);
      shoot('p',p.x+5,p.y+6,f*Math.cos(a)*270,Math.sin(a)*270,{dmg:pd.d,crit:pd.crit,w:9,h:3,life:1.5,grav:520,col:'#e8d8a0',kind:'arrow'});
    }
    sfx.arrow();sfx.skill();
  }
}
function drinkPotion(){
  if(G.state!=='play'||P.dead)return;
  if(S.potions<=0){toast('No potions');return;}
  if(P.hp>=ST.maxHp){toast('Already healthy');return;}
  S.potions--;
  const h=Math.round(ST.maxHp*.4);
  P.hp=Math.min(ST.maxHp,P.hp+h);
  floatText(P.x+5,P.y-4,'+'+h,'#7bd48f');
  burst(14,P.x+5,P.y+9,'#7bd48f',{speed:60,life:.6,g:-30,size:2});
  sfx.heal();
}
function petCommand(){
  if(!CMP){toast('No companion equipped');return;}
  if(P.petCd>0)return;
  const id=CMP.id;
  if(id==='wolf'){
    const t=nearestEnemy(P.x,P.y,150);
    if(!t){toast('No target in reach');return;}
    CMP.state='pounce';CMP.tgt=t;CMP.st=.45;
  }else if(id==='hawk'){
    const t=nearestEnemy(P.x,P.y,230,true);
    if(!t){toast('No target in reach');return;}
    CMP.state='rend';CMP.tgt=t;CMP.st=.55;
  }else if(id==='fox'){
    spawnCoins(P.x+5,P.y,8+S.lvl*2+Math.floor(Math.random()*6));
    burst(12,P.x+5,P.y+16,'#d9b36a',{speed:70,life:.5,size:2});
  }else if(id==='whelp'){
    P.breath=1;P.breathT=0;
  }else if(id==='owl'){
    const h=Math.round(ST.maxHp*.25);
    P.hp=Math.min(ST.maxHp,P.hp+h);
    floatText(P.x+5,P.y-4,'+'+h,'#7bd48f');
    burst(16,P.x+5,P.y+9,'#fff2b0',{speed:60,life:.7,g:-20,size:2});
    sfx.heal();
  }
  sfx.pet();
  P.petCd=PETS[id].cd*ST.petCd;
}

function nearestEnemy(x,y,range,strongest){
  let best=null,bs=1e9;
  for(const e of LV.enemies){
    if(e.dead||e.state==='sleep'||e.state==='intro')continue;
    const d=Math.hypot(e.x+e.w/2-x,e.y+e.h/2-y);
    if(d>range)continue;
    const s=strongest?-e.hp:d;
    if(s<bs){bs=s;best=e;}
  }
  return best;
}

/* ---------- player step ---------- */
function playerStep(dt){
  const p=P;
  if(edge.jump){p.buffer=.13;edge.jump=false;}
  p.inv=Math.max(0,p.inv-dt);p.hurt=Math.max(0,p.hurt-dt);p.atkT=Math.max(0,p.atkT-dt);
  p.atkCd-=dt;p.skillCd-=dt;p.petCd-=dt;
  const dir=(input.right?1:0)-(input.left?1:0);

  if(p.dash){
    p.dash.t-=dt;p.vx=p.dash.dir*380;p.vy=0;p.face=p.dash.dir;
    const rect={x:p.x-3,y:p.y,w:p.w+6,h:p.h};
    for(const e of LV.enemies){
      if(e.dead||p.dash.hit.indexOf(e)>=0||!aabb(rect,e))continue;
      p.dash.hit.push(e);
      const pd=playerDmg(2*ST.skillPow);
      damageEnemy(e,pd.d,{crit:pd.crit,kb:120,from:p.x+5});
    }
    if(Math.random()<.7)burst(1,p.x+5,p.y+9,'#7be0c9',{speed:20,life:.3,g:0,size:3});
    if(p.dash.t<=0){p.dash=null;p.vx=p.face*ST.speed*.6;}
  }else{
    const gnd=p.onGround;
    if(dir){
      const turning=p.vx*dir<0;
      p.vx+=dir*(gnd?1500:1000)*(turning?1.7:1)*dt;
      if(p.vx>ST.speed)p.vx=ST.speed;else if(p.vx<-ST.speed)p.vx=-ST.speed;
      p.face=dir;
    }else{
      const f=(gnd?1700:350)*dt;
      if(Math.abs(p.vx)<=f)p.vx=0;else p.vx-=Math.sign(p.vx)*f;
    }
    p.coyote=gnd?.09:p.coyote-dt;
    if(gnd)p.jumps=0;
    p.buffer-=dt;
    if(p.buffer>0){
      if(p.coyote>0){
        p.vy=-ST.jump;p.onGround=false;p.coyote=0;p.buffer=0;
        sfx.jump();burst(5,p.x+5,p.y+18,'#cbb9e8',{speed:34,life:.3,g:100,size:1.5});
      }else if(ST.dj&&p.jumps<1&&!gnd){
        p.jumps=1;p.vy=-ST.jump*.92;p.buffer=0;
        sfx.jump();burst(8,p.x+5,p.y+18,'#e8f4ff',{speed:50,life:.35,g:60,size:1.5});
      }
    }
    const gr=p.vy<0?(input.jump?1500:3400):1900;
    p.vy=Math.min(p.vy+gr*dt,540);
  }

  if(input.attack&&p.atkCd<=0&&!p.dash)doAttack();
  if(edge.skill){edge.skill=false;if(p.skillCd<=0&&!p.dash)doSkill();}
  if(edge.pet){edge.pet=false;petCommand();}
  if(edge.potion){edge.potion=false;drinkPotion();}

  if(p.breath>0){
    p.breath-=dt;p.breathT-=dt;
    const f=p.face;
    burst(2,p.x+5+f*14,p.y+9+(Math.random()-.5)*8,Math.random()<.5?'#ff8a3c':'#ffd27a',{speed:40,life:.3,g:-20,size:2.5});
    if(p.breathT<=0){
      p.breathT=.1;
      const rect={x:f>0?p.x+p.w:p.x-54,y:p.y,w:54,h:22};
      for(const e of LV.enemies){
        if(!e.dead&&aabb(rect,e)){const mul=bondMul();damageEnemy(e,Math.max(1,Math.round(4*mul*(1+(S.lvl-1)*.08))),{kb:30,from:p.x+5});}
      }
      for(const pt of LV.pots)if(!pt.broken&&aabb(rect,pt))breakPot(pt);
    }
  }

  p.x+=p.vx*dt;collideX(p);
  const preVy=p.vy,was=p.onGround;
  p.y+=p.vy*dt;p.onGround=false;collideY(p);
  if(p.onGround&&!was&&preVy>200)burst(4,p.x+5,p.y+18,'#cbb9e8',{speed:34,life:.3,g:100,size:1.5});
  p.run+=Math.abs(p.vx)*dt*.09;
  p.blink-=dt;if(p.blink<-.12)p.blink=1.5+Math.random()*3;

  if(p.y>ROWS*T+24){
    if(p.inv>0&&false){}
    hurtPlayerForce(Math.round(ST.maxHp*.2));
    return;
  }
  if(p.inv<=0&&!p.dash){
    const x0=Math.floor((p.x+1)/T),x1=Math.floor((p.x+p.w-1)/T),y0=Math.floor((p.y+8)/T),y1=Math.floor((p.y+p.h-1)/T);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
      if(tx>=0&&tx<LV.W&&ty>=0&&ty<ROWS&&LV.g[ty][tx]==='^'){
        const sx=tx*T+2,sy=ty*T+8;
        if(p.x+p.w>sx&&p.x<sx+12&&p.y+p.h>sy&&p.y<sy+8){hurtPlayer(12+LV.si*2,tx*T+8);p.vy=-220;return;}
      }
    }
  }
}
/* falling into a pit: lose some health and return to the last safe checkpoint */
function hurtPlayerForce(d){
  P.hp-=d;
  floatText(P.x+5,ROWS*T-8,'-'+d,'#ff6b5a');
  sfx.hurt();
  if(P.hp<=0){playerDie();return;}
  P.x=LV.spawnPt.x;P.y=LV.spawnPt.y;P.vx=0;P.vy=0;P.inv=1.5;P.onGround=false;
  snapCamera();
}
function playerDie(){
  if(P.dead)return;
  P.dead=true;G.state='dying';G.timer=1.3;
  sfx.die();
  burst(26,P.x+5,P.y+9,'#ffb347',{speed:120,life:.9,g:180,size:2});
  burst(10,P.x+5,P.y+9,'#f3e7d3',{speed:90,life:.7,g:120,size:2});
  G.lostGold=Math.floor(S.gold*.1);S.gold-=G.lostGold;
}
function respawn(){
  const a=LV.arena;
  if(a&&a.triggered&&!a.done){
    a.triggered=false;closeDoor(false);
    LV.enemies=LV.enemies.filter(e=>e.type!=='boss'&&!e.minion);
    a.boss=null;
  }
  LV.projs=LV.projs.filter(q=>q.owner==='p');
  P=newPlayer(LV.spawnPt.x,LV.spawnPt.y);
  P.hp=ST.maxHp;P.inv=1.6;
  spawnCompanion();
  G.state='play';snapCamera();
  toast(G.lostGold>0?'You fell. Lost '+G.lostGold+' gold':'You fell. Back to the last fire');
}

/* ---------- enemies ---------- */
function strike(e,reach,dmg){
  const rect={x:e.dir>0?e.x+e.w:e.x-reach,y:e.y+2,w:reach,h:e.h-4};
  LV.fx.push({k:'estrike',x:rect.x,y:rect.y,w:reach,h:rect.h,f:e.dir,t:.12,max:.12});
  if(aabb(rect,playerRect()))hurtPlayer(Math.round(dmg*e.mul),e.x+e.w/2);
}
function walk(e,dt,checkLedge){
  const base=e.vx;
  e.vx=base+e.kvx;
  const wall=moveBody(e,dt);
  e.vx=base;
  let flip=wall;
  if(checkLedge&&e.onGround&&!flip&&base!==0){
    const fx=base>0?e.x+e.w+1:e.x-1;
    if(!solid(Math.floor(fx/T),Math.floor((e.y+e.h+2)/T)))flip=true;
  }
  return flip;
}
function enemyShoot(e,kind){
  const sk=SKINS[S.arc],cx=e.x+e.w/2,cy=e.y+(kind==='orb'?e.h/2:7);
  if(kind==='orb'){
    const dx=P.x+5-cx,dy=P.y+9-cy,d=Math.hypot(dx,dy)||1;
    shoot('e',cx,cy,dx/d*80,dy/d*80,{dmg:Math.round(10*e.mul),w:6,h:6,life:3,col:sk.bolt,kind:'orb'});
  }else{
    shoot('e',cx,cy,e.dir*150,0,{dmg:Math.round(9*e.mul),w:8,h:3,life:2,col:sk.bolt,kind:'bolt'});
  }
}
function enemyStep(e,dt){
  if(e.dead){e.dying-=dt;return;}
  if(e.state==='intro')return;
  e.hurt=Math.max(0,e.hurt-dt);
  if(e.stun>0)e.stun-=dt;
  e.kvx-=e.kvx*Math.min(1,dt*9);
  const px=P.x+5,py=P.y+9;
  const dx=px-(e.x+e.w/2),dy=py-(e.y+e.h/2),adx=Math.abs(dx);
  const stunned=e.stun>0;
  switch(e.type){
    case 'slime':{
      e.vy=Math.min(e.vy+1500*dt,420);
      if(e.onGround){
        const f=500*dt;if(Math.abs(e.vx)<=f)e.vx=0;else e.vx-=Math.sign(e.vx)*f;
        e.t-=dt;
        if(e.t<=0&&!stunned){
          if(adx<115&&Math.abs(dy)<70){e.dir=dx>0?1:-1;e.vx=e.dir*48;e.vy=-190;}
          else{e.dir=Math.random()<.5?1:-1;e.vx=e.dir*26;e.vy=-120;}
          e.t=1+Math.random()*.8;
        }
      }
      walk(e,dt,false);
      break;
    }
    case 'skeleton':case 'knight':{
      const kn=e.type==='knight';
      e.vy=Math.min(e.vy+1500*dt,420);
      if(stunned){e.vx=0;}
      else if(e.state==='patrol'){
        e.vx=e.dir*(kn?18:28);
        if(adx<(kn?60:64)&&Math.abs(dy)<26){e.dir=dx>0?1:-1;e.state='wind';e.t=kn?.55:.4;e.vx=0;}
      }else if(e.state==='wind'){
        e.vx=0;e.t-=dt;
        if(e.t<=0){e.state='swing';e.t=.16;strike(e,kn?24:18,kn?16:11);}
      }else if(e.state==='swing'){
        e.vx=0;e.t-=dt;if(e.t<=0){e.state='rec';e.t=.55;}
      }else{
        e.vx=0;e.t-=dt;if(e.t<=0)e.state='patrol';
      }
      if(walk(e,dt,e.state==='patrol'))e.dir=-e.dir;
      break;
    }
    case 'archer':{
      e.vy=Math.min(e.vy+1500*dt,420);e.vx=0;
      if(!stunned&&adx<190&&Math.abs(dy)<60){
        e.dir=dx>0?1:-1;
        if(e.state==='idle'){e.t-=dt;if(e.t<=0){e.state='aim';e.t=.5;}}
        else if(e.state==='aim'){e.t-=dt;if(e.t<=0){enemyShoot(e,'bolt');e.state='idle';e.t=1.7;}}
      }else if(e.state==='aim'&&!stunned){e.state='idle';}
      walk(e,dt,false);
      break;
    }
    case 'wisp':{
      e.ph+=dt;
      const ty=e.y0+Math.sin(e.ph*1.6)*10;
      e.y+=(ty-e.y)*Math.min(1,dt*3);
      let vxw=0;
      if(!stunned&&adx<160&&Math.abs(dy)<120){
        e.dir=dx>0?1:-1;
        vxw=adx>85?e.dir*26:(adx<50?-e.dir*20:0);
        e.t-=dt;
        if(e.t<=0){enemyShoot(e,'orb');e.t=2.4;}
      }
      e.x+=(vxw+e.kvx)*dt;
      break;
    }
    case 'bat':{
      e.ph+=dt;
      if(e.state==='sleep'||e.state==='idle'){
        e.x+=e.kvx*dt;
        if(!stunned&&adx<88&&Math.abs(dy)<92)e.state='chase';
      }else{
        if(!stunned){
          e.dir=dx>0?1:-1;
          e.x+=(e.dir*58+e.kvx)*dt;
          e.y+=((py-6-(e.y+e.h/2))*1.4+Math.sin(e.ph*8)*22)*dt;
          if(adx>270)e.state='idle';
        }else e.x+=e.kvx*dt;
      }
      break;
    }
    case 'boss':bossStep(e,dt,dx,adx);break;
  }
  if(e.state!=='sleep'&&!stunned&&e.dying<=0){
    const er={x:e.x+1,y:e.y+1,w:e.w-2,h:e.h-2};
    if(aabb(er,playerRect())){
      let d=e.touch;
      if(e.type==='boss')d=e.state==='charge'?e.touch:Math.round(e.touch*.5);
      hurtPlayer(d,e.x+e.w/2);
    }
  }
}

/* ---------- boss ---------- */
function mkBoss(){
  const a=LV.arena;
  const e=mkEnemy('boss',a.bossSpawn.x,a.bossSpawn.y,LV.si);
  e.state='intro';e.name=S.arc==='hero'?'Warden Vorn':'Paladin Seren';e.n=0;e.summoned=false;e.mul=1.25;e.touch=20;
  return e;
}
function bossStep(e,dt,dx,adx){
  const a=LV.arena,ph2=e.hp<e.maxHp*.5;
  e.vy=Math.min(e.vy+1500*dt,500);
  e.t-=dt;
  switch(e.state){
    case 'idle':
      e.vx=0;e.dir=dx>0?1:-1;
      if(e.t<=0){
        const cyc=['charge','slam','fan','charge','slam'];
        if(ph2&&!e.summoned){e.state='summon';e.t=.8;}
        else{
          const k=cyc[e.n++%cyc.length];
          e.state=k+'_wind';e.t=k==='charge'?.55:k==='slam'?.5:.6;
        }
      }
      break;
    case 'charge_wind':e.vx=0;if(e.t<=0){e.state='charge';e.t=.8;e.vx=e.dir*(ph2?210:170);}break;
    case 'charge':
      if(e.t<=0){e.state='recover';e.t=.9;e.vx=0;}
      break;
    case 'recover':e.vx=0;if(e.t<=0){e.state='idle';e.t=ph2?.45:.8;}break;
    case 'slam_wind':e.vx=0;if(e.t<=0){e.state='slam_air';e.vy=-390;e.vx=clampN(dx*.9,-130,130);e.t=.2;}break;
    case 'slam_air':{
      if(e.onGround&&e.t<=0){
        e.vx=0;G.shake=.3;sfx.slam();
        const sk=SKINS[S.arc];
        for(const s of [-1,1])shoot('e',e.x+e.w/2-6,a.top*T-9,s*(ph2?140:115),0,{dmg:Math.round(14*e.mul),w:12,h:9,life:1.8,col:sk.glow,kind:'wave'});
        burst(16,e.x+e.w/2,e.y+e.h,'#c9b79a',{speed:90,life:.5,size:2});
        e.state='recover';e.t=.7;
      }
      break;
    }
    case 'fan_wind':{
      e.vx=0;
      if(e.t<=0){
        const sk=SKINS[S.arc],n=ph2?7:5,cx=e.x+e.w/2,cy=e.y+8;
        const aim=Math.atan2(P.y+9-cy,P.x+5-cx);
        for(let i=0;i<n;i++){
          const ang=aim+(i-(n-1)/2)*.28;
          shoot('e',cx,cy,Math.cos(ang)*100,Math.sin(ang)*100,{dmg:Math.round(9*e.mul),w:6,h:6,life:3,col:sk.bolt,kind:'orb'});
        }
        sfx.bolt();
        e.state='recover';e.t=.8;
      }
      break;
    }
    case 'summon':{
      e.vx=0;
      if(e.t<=0){
        e.summoned=true;
        for(const off of [10,24]){
          const m=mkEnemy('skeleton',(a.x0+off)*T,a.top*T-60,LV.si);
          m.minion=true;m.dir=-1;LV.enemies.push(m);
          burst(10,m.x+5,m.y+9,SKINS[S.arc].glow,{speed:70,life:.5,g:0,size:2});
        }
        sfx.boss();
        e.state='recover';e.t=1;
      }
      break;
    }
  }
  const wall=moveBody(e,dt);
  if(wall&&e.state==='charge'){e.state='recover';e.t=.9;e.vx=0;G.shake=.2;}
}
function clampN(v,a,b){return v<a?a:v>b?b:v;}
function closeDoor(closed){
  const a=LV.arena;
  for(let rr=a.top-7;rr<a.top;rr++)LV.g[rr][a.doorCol]=closed?'B':'.';
}
function bossDefeated(e){
  const a=LV.arena;
  a.done=true;
  for(const m of LV.enemies)if(m.minion&&!m.dead){m.dead=true;m.dying=.3;burst(10,m.x+5,m.y+9,'#d8d0e8',{speed:80,life:.5});}
  LV.projs=LV.projs.filter(q=>q.owner==='p');
  sfx.win();
  S.flags.bossDown=true;
  G.pending=()=>runScene('boss_outro',()=>{closeDoor(false);LV.goal.visible=true;toast('The gate is open');});
}

/* ---------- projectiles, pickups, objects ---------- */
function projStep(dt){
  for(let i=LV.projs.length-1;i>=0;i--){
    const q=LV.projs[i];
    q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.grav*dt;
    let dead=q.life<=0;
    if(!dead&&q.kind!=='wave'&&solid(Math.floor((q.x+q.w/2)/T),Math.floor((q.y+q.h/2)/T)))dead=true;
    if(!dead){
      if(q.owner==='p'){
        for(const e of LV.enemies){
          if(e.dead||q.hits.indexOf(e)>=0||!aabb(q,e))continue;
          damageEnemy(e,q.dmg,{crit:q.crit,kb:70,from:q.x-Math.sign(q.vx||1)*30,stun:q.stun});
          q.hits.push(e);
          if(q.pierce--<=0){dead=true;break;}
        }
        for(const pt of LV.pots)if(!pt.broken&&aabb(q,pt)){breakPot(pt);dead=true;}
      }else if(aabb(q,playerRect())){hurtPlayer(q.dmg,q.x);dead=true;}
    }
    if(dead){if(q.kind!=='wave')burst(3,q.x,q.y,q.col,{speed:30,life:.2,g:0,size:1.5});LV.projs.splice(i,1);}
  }
}
function coinsStep(dt){
  const px=P.x+5,py=P.y+9,mag=20+(S.equip==='fox'?28:0);
  for(let i=LV.coins.length-1;i>=0;i--){
    const c=LV.coins[i];
    if(!c.st){
      c.age+=dt;c.vy+=900*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx-=c.vx*Math.min(1,dt*2);
      const tx=Math.floor(c.x/T),ty=Math.floor((c.y+3)/T);
      if(solid(tx,ty)&&c.vy>0){c.y=ty*T-3;c.vy=-c.vy*.4;if(Math.abs(c.vy)<30)c.vy=0;c.vx*=.6;}
      if(c.y>ROWS*T+40){LV.coins.splice(i,1);continue;}
    }
    const dx=px-c.x,dy=py-c.y,d2=dx*dx+dy*dy;
    const can=c.st||c.age>.35;
    if(can&&d2<mag*mag){c.st=true;c.mag=true;}
    if(c.mag){const d=Math.sqrt(d2)||1;c.x+=dx/d*230*dt;c.y+=dy/d*230*dt;}
    if(can&&d2<70){gainGold(c.v);LV.coins.splice(i,1);}
  }
  for(let i=LV.loot.length-1;i>=0;i--){
    const l=LV.loot[i];
    l.t+=dt;l.vy+=700*dt;l.y+=l.vy*dt;
    const ty=Math.floor((l.y+6)/T),tx=Math.floor(l.x/T);
    if(solid(tx,ty)&&l.vy>0){l.y=ty*T-6;l.vy=0;}
    if(Math.abs(px-l.x)<9&&Math.abs(py-(l.y))<14&&l.t>.3){

/* ---------- companion ---------- */
function companionStep(dt){
  const c=CMP;
  if(!c)return;
  const p=P;
  c.t+=dt;c.cd-=dt;
  if(Math.abs(p.x-c.x)>260||Math.abs(p.y-c.y)>170){c.x=p.x-p.face*14;c.y=p.y;c.vx=c.vy=0;c.state='follow';}
  const id=c.id,b=bondMul();
  if(c.state==='pounce'||c.state==='rend'){
    c.st-=dt;
    const t=c.tgt;
    if(!t||t.dead){c.state='follow';return;}
    const tx=t.x+t.w/2,ty=t.y+t.h/2;
    const k=Math.min(1,dt*(c.state==='pounce'?12:11));
    c.x+=(tx-c.x)*k;c.y+=(ty-c.y)*k;c.vy=0;
    c.face=tx>c.x?1:-1;
    if(Math.abs(tx-c.x)<8&&Math.abs(ty-c.y)<12||c.st<=0){
      if(c.state==='pounce')damageEnemy(t,Math.round(16*b*(1+(S.lvl-1)*.08)),{stun:.8,kb:110,from:c.x});
      else damageEnemy(t,Math.round(22*b*(1+(S.lvl-1)*.08)),{stun:.6,kb:60,from:c.x});
      burst(8,tx,ty,'#fff',{speed:80,life:.3,size:2});
      c.state='follow';c.cd=1.2;
    }
    return;
  }
  if(c.fly){
    let tx=p.x-p.face*18,ty=p.y-20+Math.sin(c.t*3)*3;
    if(id==='hawk'&&c.state==='dive'){
      c.st-=dt;
      const t=c.tgt;
      if(!t||t.dead||c.st<=0){c.state='follow';c.cd=2.2*ST.petCd;}
      else{
        const k=Math.min(1,dt*10);
        c.x+=(t.x+t.w/2-c.x)*k;c.y+=(t.y+2-c.y)*k;
        if(Math.abs(t.x+t.w/2-c.x)<9&&Math.abs(t.y-c.y)<12){
          damageEnemy(t,Math.max(1,Math.round(6*b*(1+(S.lvl-1)*.08))),{kb:50,from:c.x});
          c.state='follow';c.cd=2.2*ST.petCd;
        }
      }
    }else{
      c.x+=(tx-c.x)*Math.min(1,dt*5);c.y+=(ty-c.y)*Math.min(1,dt*5);
      c.face=p.face;
      if(c.cd<=0){
        if(id==='hawk'){
          const t=nearestEnemy(c.x,c.y,135);
          if(t){c.state='dive';c.tgt=t;c.st=.5;}
        }else if(id==='whelp'){
          const t=nearestEnemy(c.x,c.y,155);
          if(t){
            const dx=t.x+t.w/2-c.x,dy=t.y+t.h/2-c.y,d=Math.hypot(dx,dy)||1;
            shoot('p',c.x,c.y,dx/d*150,dy/d*150,{dmg:Math.max(1,Math.round(5*b*(1+(S.lvl-1)*.08))),w:6,h:6,life:1.2,col:'#ff8a3c',kind:'fire'});
            c.cd=1.6*ST.petCd;c.face=dx>0?1:-1;
          }else c.cd=.3;
        }else if(id==='owl'){
          if(P.hp<ST.maxHp){P.hp++;floatText(P.x+5,P.y-6,'+1','#7bd48f');burst(5,c.x,c.y,'#fff2b0',{speed:30,life:.5,g:-20,size:1.5});}
          c.cd=6;
        }
      }
    }
    return;
  }
  /* ground companions */
  c.vy=Math.min(c.vy+1500*dt,420);
  let tx=p.x-p.face*16;
  let want=0;
  if(id==='wolf'){
    const t=nearestEnemy(c.x,c.y,80);
    if(t&&Math.abs(t.y-c.y)<30){
      tx=t.x+t.w/2;
      if(Math.abs(tx-c.x)<14&&c.cd<=0){
        damageEnemy(t,Math.max(1,Math.round(4*b*(1+(S.lvl-1)*.08))),{kb:50,from:c.x});
        c.cd=.8*ST.petCd;
      }
    }
  }else if(id==='fox'&&c.cd<=0){
    c.cd=9;spawnCoins(c.x,c.y,2+Math.floor(S.lvl/2));
    burst(5,c.x,c.y,'#d9b36a',{speed:40,life:.4,size:1.5});
  }
  const dx=tx-c.x;
  if(Math.abs(dx)>(id==='wolf'&&nearestEnemy(c.x,c.y,80)?3:22)){want=dx>0?1:-1;}
  c.vx=want*(id==='wolf'?125:110);
  if(want)c.face=want;
  const wall=moveBody(c,dt);
  if(wall&&c.onGround)c.vy=-290;
  if(c.y>ROWS*T+30){c.x=p.x;c.y=p.y;c.vy=0;}
}

/* ---------- world step ---------- */
function worldStep(dt){
  G.t+=dt;
  playerStep(dt);
  if(G.state!=='play')return;
  for(const e of LV.enemies)enemyStep(e,dt);
  LV.enemies=LV.enemies.filter(e=>!(e.dead&&e.dying<=0));
  if(G.state!=='play')return;
  projStep(dt);
  companionStep(dt);
  coinsStep(dt);
  interactStep();
  if(G.pending&&G.state==='play'){const f=G.pending;G.pending=null;f();}
}
function auxStep(dt){
  for(let i=LV.texts.length-1;i>=0;i--){
    const t=LV.texts[i];
    t.life-=dt;t.y-=18*dt;
    if(t.life<=0)LV.texts.splice(i,1);
  }
  for(let i=LV.fx.length-1;i>=0;i--){LV.fx[i].t-=dt;if(LV.fx[i].t<=0)LV.fx.splice(i,1);}
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=dt;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  }
}

function R(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function tri(ax,ay,bx,by,cx,cy){ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,by);ctx.lineTo(cx,cy);ctx.closePath();ctx.fill();}

{const rr=mulberry32(77);for(let i=0;i<70;i++)stars.push({x:rr(),y:rr(),tw:rr()*6});}

function buildSky(th){

function bgH(style,wx,layer){
  switch(style){
    case 'pine':{
      const t=Math.abs((((wx+layer*7)%22)+22)%22-11)/11;
      return 18+8*Math.sin(wx*.02+layer)+(layer?26:34)*(1-t);
    }
    case 'ruins':{
      const idx=Math.floor(wx/14),hh=hash(idx,layer)%5;
      if(hash(idx,9)%7===0)return 8;
      let h=24+hh*9;
      if(Math.floor(wx/5)%2===0)h-=4;
      return h;
    }
    case 'pillars':{
      const idx=Math.floor(wx/38);
      if(hash(idx,layer)%3===0&&(((wx%38)+38)%38)<12)return 96;
      return 16+7*Math.sin(wx*.03);
    }
    case 'jagged':
      return 26+34*Math.abs(Math.sin(wx*.017+layer*2))*(.6+.4*Math.sin(wx*.05));
    default:{
      let h=24+20*Math.sin(wx*.011+1.3)+8*Math.sin(wx*.04);
      if(layer===0&&((wx>740&&wx<762)||(wx>838&&wx<860)))h=150;
      if(layer===0&&wx>=740&&wx<=860)h=Math.max(h,wx<762||wx>838?150:136);
      return h;
    }
  }
}

    else{ctx.fillStyle='rgba(215,180,255,'+(.2+.4*Math.abs(Math.sin(t*1.2+i)))+')';ctx.fillRect(Math.round((sx0+Math.sin(t*.5+i)*12)%vw),Math.round(sy0*.7+Math.sin(t*.8+i)*6),2,2);}
  }

/* ---------- canvas sizing and camera ---------- */
function resize(){
  const r=stage.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
  const W=Math.max(2,Math.round(r.width*dpr)),H=Math.max(2,Math.round(r.height*dpr));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  let s=Math.min(W/256,H/184);
  s=Math.max(1,Math.floor(s*16)/16);
  SC=s;vw=W/SC;vh=H/SC;
  ctx.imageSmoothingEnabled=false;
  skyTheme=null;
  if(LV&&P)snapCamera();
}
function camTarget(){
  const lw=LV.W*T,lh=ROWS*T;
  const look=Math.max(-26,Math.min(26,P.vx*.22));
  let tx=P.x+P.w/2-vw/2+look;
  tx=lw<=vw?(lw-vw)/2:Math.max(0,Math.min(lw-vw,tx));
  const ty=vh>=lh?lh-vh:Math.max(0,Math.min(lh-vh,P.y+P.h/2-vh*.6));
  return {tx,ty};
}
function snapCamera(){if(!LV||!P)return;const c=camTarget();camX=c.tx;camY=c.ty;}
function updateCamera(dt){
  if(!LV||!P||G.state==='title'||G.state==='menu')return;
  const c=camTarget();
  camX+=(c.tx-camX)*(1-Math.exp(-dt*9));
  camY+=(c.ty-camY)*(1-Math.exp(-dt*6));
}

  showScreen('<div class="panel center"><div class="kicker">Chapter I</div><h1>Shardfall</h1><p class="sub">The Broken Gate</p>'+
    '<p class="small">A realm cracked in two. A hero or a villain rises, with blade, spell, and beasts at their side.</p>'+
    (hasSave()?'<button class="btn" data-act="continue">Continue</button><button class="btn alt" data-act="new">New game</button><p class="small">A new game replaces your saved one.</p>':'<button class="btn" data-act="new">New game</button>')+
    '</div>','','title');
}
function screenArc(){
  showScreen('<div class="panel"><h2>Choose your path</h2><p class="small">Your path changes the story, the foes you face, and who guards the Gate.</p><div class="scroll">'+
    '<button class="card hero" data-act="arc" data-v="hero"><h3 style="color:#7bd8ff">The Dawnbearer</h3><p class="sub">Mend the broken Sunshard and stop the Hollow King. You fight the Hollow and face Warden Vorn.</p></button>'+
    '<button class="card villain" data-act="arc" data-v="villain"><h3 style="color:#c27bff">The Shadow Heir</h3><p class="sub">Seize the shards for yourself and take the throne. You fight the Sunguard and face Paladin Seren.</p></button>'+
    '</div></div>','','arc');
}
function screenClass(){
  const cards=CLASS_IDS.map(id=>{
    const c=CLASSES[id];
    const m=Object.keys(c.meters).map(k=>'<div class="meter"><span>'+k+'</span><i><b style="width:'+c.meters[k]*20+'%"></b></i></div>').join('');
    return '<button class="card'+(pending.cls===id?' sel':'')+'" data-act="cls" data-v="'+id+'"><h3 style="color:'+c.col.trim+'">'+c.name+'</h3><p class="small">'+c.blurb+'</p>'+m+'<p class="small"><b>'+c.skill.name+'</b>: '+c.skill.desc+'</p></button>';
  }).join('');
  showScreen('<div class="panel"><h2>Choose your class</h2><p class="small">You can switch class at camp whenever you like.</p><div class="scroll"><div class="cards">'+cards+'</div></div><button class="btn" data-act="begin"'+(pending.cls?'':' disabled')+'>Begin</button></div>','','class');
}
function pips(r,m){let h='<div class="pips">';for(let i=0;i<m;i++)h+='<i'+(i<r?' class="on"':'')+'></i>';return h+'</div>';}
function campBody(){
  if(campTab==='journey'){
    return STAGES.map((st,i)=>{
      const open=i===0||S.clear[i-1],done=S.clear[i];
      return '<div class="row"><div class="grow"><b>'+(i+1)+'. '+st.name+'</b><span>'+(done?'Cleared':open?'Ready':'Locked until the last stage is cleared')+(st.boss?' · Boss':'')+'</span></div><button class="btn sm" data-act="go" data-v="'+i+'"'+(open?'':' disabled')+'>'+(done?'Replay':'Go')+'</button></div>';
    }).join('')+'<p class="small">Replaying a stage earns gold and experience. Chests refill and found companions stay with you.</p>';
  }
  if(campTab==='skills'){
    const nodes=UNI.concat(NODES[S.cls]).filter(n=>!(n.id==='air'&&CLASSES[S.cls].dj));
    return '<p class="small"><b>'+CLASSES[S.cls].name+'</b> special: '+CLASSES[S.cls].skill.name+'. '+CLASSES[S.cls].skill.desc+'</p>'+nodes.map(n=>{
      const r=S.ranks[n.id]||0,cost=n.cost||1,can=r<n.max&&S.sp>=cost;
      return '<div class="row"><div class="grow"><b>'+n.name+'</b><span>'+n.desc+'</span>'+pips(r,n.max)+'</div>'+(r>=n.max?'<span class="tag ok">Max</span>':'<button class="btn sm" data-act="learn" data-v="'+n.id+'"'+(can?'':' disabled')+'>+ '+cost+'</button>')+'</div>';
    }).join('');
  }
  if(campTab==='forge'){
    const w=FORGE.weapon[S.weapon],nw=FORGE.weapon[S.weapon+1],a=FORGE.armor[S.armor],na=FORGE.armor[S.armor+1];
    let h='';
    h+='<div class="row"><div class="grow"><b>'+w.n+' '+CLASSES[S.cls].weapon+'</b><span>+'+Math.round(w.b*100)+'% damage</span></div>'+(nw?'<button class="btn sm" data-act="forge" data-v="weapon"'+(S.gold>=nw.cost?'':' disabled')+'>'+nw.n+' · '+nw.cost+'g</button>':'<span class="tag ok">Best</span>')+'</div>';
    h+='<div class="row"><div class="grow"><b>'+a.n+' armor</b><span>+'+a.hp+' max HP</span></div>'+(na?'<button class="btn sm" data-act="forge" data-v="armor"'+(S.gold>=na.cost?'':' disabled')+'>'+na.n+' · '+na.cost+'g</button>':'<span class="tag ok">Best</span>')+'</div>';
    h+='<div class="row"><div class="grow"><b>Healing potion</b><span>Heals 40% of your health. You carry '+S.potions+' of 9.</span></div><button class="btn sm" data-act="forge" data-v="potion"'+(S.gold>=FORGE.potion&&S.potions<9?'':' disabled')+'>'+FORGE.potion+'g</button></div>';
    h+=S.pets.fox?'<div class="row"><div class="grow"><b>Ember the Fox</b><span>Already in your company.</span></div><span class="tag ok">Owned</span></div>':'<div class="row"><div class="dot" style="background:'+PETS.fox.col+'">E</div><div class="grow"><b>Ember the Fox</b><span>'+PETS.fox.passive+' '+PETS.fox.cmd+'</span></div><button class="btn sm" data-act="forge" data-v="fox"'+(S.gold>=FORGE.fox?'':' disabled')+'>'+FORGE.fox+'g</button></div>';
    return h;
  }
  if(campTab==='beasts'){
    return PET_IDS.map(id=>{
      const p=PETS[id],own=S.pets[id],eq=S.equip===id;
      return '<div class="row"><div class="dot" style="background:'+p.col+'">'+p.name[0]+'</div><div class="grow"><b>'+p.name+' the '+p.kind+'</b><span>'+p.passive+'<br>'+p.cmd+'</span><div class="small">'+(own?'Bond level '+bondLevel(id)+' of 5':p.from)+'</div></div>'+(own?'<button class="btn sm'+(eq?' alt':'')+'" data-act="equip" data-v="'+id+'">'+(eq?'Equipped':'Equip')+'</button>':'<span class="tag">Locked</span>')+'</div>';
    }).join('')+'<p class="small">Only one companion travels with you at a time. Bond grows with each foe defeated and makes them stronger.</p>';
  }
  return '<div class="cards">'+CLASS_IDS.map(id=>{
    const c=CLASSES[id];
    return '<button class="card'+(S.cls===id?' sel':'')+'" data-act="switch" data-v="'+id+'"><h3 style="color:'+c.col.trim+'">'+c.name+'</h3><p class="small">'+c.skill.name+'</p>'+(S.cls===id?'<span class="tag ok">Current</span>':'<span class="tag">Switch</span>')+'</button>';
  }).join('')+'</div><p class="small">Skill points you spend stay with each class. Switching is free.</p>';
}
function renderCamp(){
  const tabs=[['journey','Journey'],['skills','Skills'],['forge','Forge'],['beasts','Beasts'],['class','Class']];
  showScreen('<div class="panel"><div class="kicker">Camp at the Wayfire</div>'+
    '<div class="stat"><span style="color:var(--bone)">Lv '+S.lvl+' '+CLASSES[S.cls].name+'</span><span style="color:var(--xp)">'+S.sp+' skill pts</span><span style="color:var(--gold)">'+S.gold+' gold</span></div>'+
    '<div class="tabs">'+tabs.map(t=>'<button class="tab'+(campTab===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+
    '<div class="scroll">'+campBody()+'</div></div>','',campTab);
}
function goCamp(){
  G.state='menu';LV=null;P=null;CMP=null;menuTheme=0;parts.length=0;
  setHud(false);app.classList.remove('talk');$('dlg').hidden=true;
  ST=computeStats();saveGame();setMusic(196);
  renderCamp();
}
function learn(id){
  const n=UNI.concat(NODES[S.cls]).filter(x=>x.id===id)[0];
  if(!n)return;
  const r=S.ranks[id]||0,cost=n.cost||1;
  if(r>=n.max||S.sp<cost)return;
  S.ranks[id]=r+1;S.sp-=cost;
  refreshStats();saveGame();renderCamp();
}
function forge(what){
  if(what==='weapon'){const n=FORGE.weapon[S.weapon+1];if(n&&S.gold>=n.cost){S.gold-=n.cost;S.weapon++;}}
  else if(what==='armor'){const n=FORGE.armor[S.armor+1];if(n&&S.gold>=n.cost){S.gold-=n.cost;S.armor++;}}
  else if(what==='potion'){if(S.gold>=FORGE.potion&&S.potions<9){S.gold-=FORGE.potion;S.potions++;}}
  else if(what==='fox'){if(!S.pets.fox&&S.gold>=FORGE.fox){S.gold-=FORGE.fox;S.pets.fox=true;if(!S.equip)S.equip='fox';}}
  sfx.chest();refreshStats();saveGame();renderCamp();
}

/* ---------- story ---------- */
function applyEff(eff){
  if(!eff)return;
  if(eff.mercy)S.mercy+=eff.mercy;
  if(eff.gold){S.gold+=eff.gold;G.goldRun+=eff.gold;}
  if(eff.potion)S.potions=Math.min(9,S.potions+eff.potion);
  if(eff.flag)S.flags[eff.flag]=true;
  refreshStats();
}
function runScene(id,cb){
  scene.lines=getScene(id).slice();scene.i=0;scene.cb=cb||null;scene.choice=null;
  G.state='talk';releaseAll();
  app.classList.add('talk');$('dlg').hidden=false;
  nextLine();
}
function nextLine(){
  if(scene.i>=scene.lines.length){endScene();return;}
  const ln=scene.lines[scene.i++];
  if(ln.choice){showChoice(ln.choice);return;}
  $('dChoices').innerHTML='';$('dBox').hidden=false;
  const col=SPEAKER[ln.w]||'#ffffff';
  $('dName').textContent=ln.w;$('dName').style.color=col;
  $('dPort').textContent=ln.w[0];$('dPort').style.background=col;
  scene.full=ln.t;scene.pos=0;scene.typing=true;scene.choice=null;
  $('dText').textContent='';$('dMore').hidden=false;
}
function showChoice(ch){
  scene.choice=ch;scene.typing=false;
  $('dName').textContent='Choose';$('dName').style.color='#ffb347';
  $('dPort').textContent='?';$('dPort').style.background='#ffb347';
  $('dText').textContent=ch.prompt;$('dMore').hidden=true;
  $('dChoices').innerHTML=ch.opts.map((o,i)=>'<button class="btn alt" data-ch="'+i+'" style="background:rgba(20,15,34,.96)">'+esc(o.t)+'</button>').join('');
}
function advance(){
  if(G.state!=='talk')return;
  if(scene.choice)return;
  if(scene.typing){scene.typing=false;$('dText').textContent=scene.full;return;}
  sfx.click();nextLine();
}
function endScene(){
  $('dlg').hidden=true;$('dChoices').innerHTML='';app.classList.remove('talk');
  const cb=scene.cb;scene.cb=null;scene.choice=null;
  G.state=(LV&&P)?'play':'menu';
  if(cb)cb();
}
$('dlg').addEventListener('click',e=>{
  audioInit();
  const b=e.target.closest('[data-ch]');
  if(b&&scene.choice){
    const o=scene.choice.opts[+b.dataset.ch];
    sfx.click();applyEff(o.eff);
    scene.choice=null;$('dChoices').innerHTML='';
    if(o.next)scene.lines.splice(scene.i,0,...o.next);
    nextLine();
    return;
  }
  advance();
});

/* ---------- game flow ---------- */
function newGame(){
  S=newSave(pending.arc,pending.cls);
  G.arc=S.arc;refreshStatsSafe();saveGame();
  hideScreen();LV=null;P=null;menuTheme=0;
  runScene('prologue',()=>goCamp());
}
function refreshStatsSafe(){ST=computeStats();}
function continueGame(){
  const sv=lsGet('shardfall.save',null);
  if(!sv){screenArc();return;}
  S=sv;G.arc=S.arc;
  S.flags=S.flags||{};S.seen=S.seen||{};S.pets=S.pets||{};S.bond=S.bond||{};S.ranks=S.ranks||{};
  goCamp();
}
function startStage(si){
  G.stageIdx=si;
  hideScreen();
  LV=genStage(si);ST=computeStats();
  P=newPlayer(LV.spawn.x,LV.spawn.y);P.hp=ST.maxHp;
  spawnCompanion();
  parts.length=0;G.kills=0;G.goldRun=0;G.xpRun=0;G.t=0;G.pending=null;
  skyTheme=null;menuTheme=LV.cfg.theme;
  setMusic(LV.theme.root);
  setHud(true);snapCamera();
  runScene('intro_'+si,()=>{toast(LV.cfg.name);});
}
function onGoal(){
  const si=G.stageIdx;
  S.clear[si]=true;releaseAll();sfx.win();
  burst(30,LV.goal.x,LV.goal.y-20,'#ffd27a',{speed:110,life:1,g:60,size:2});
  if(LV.cfg.boss)runScene('epilogue',()=>stageClearScreen(true));
  else runScene('end_'+si,()=>stageClearScreen(false));
}
function stageClearScreen(final){
  G.state='end';saveGame();
  showScreen('<div class="panel center"><div class="kicker">'+LV.cfg.name+'</div><h2>'+(final?'Chapter complete':'Stage cleared')+'</h2>'+
    '<div class="stat" style="justify-content:center"><span style="color:var(--gold)">+'+G.goldRun+' gold</span><span style="color:var(--xp)">+'+G.xpRun+' xp</span><span style="color:var(--bone)">'+G.kills+' foes</span></div>'+
    (final?'<p class="sub">Chapter II is still being forged. Everything you earned stays with you, and you can replay any stage from camp.</p>':'<p class="sub">Rest at the fire, spend your skill points, and visit the forge.</p>')+
    '<button class="btn" data-act="camp">Return to camp</button></div>','clear','end');
}
function togglePause(){
  if(G.state==='play'){
    G.state='paused';releaseAll();
    showScreen('<div class="panel center"><h2>Paused</h2><button class="btn" data-act="resume">Resume</button><button class="btn alt" data-act="quit">Return to camp</button><p class="small">Returning to camp abandons this attempt at the stage. Your level and gold are kept.</p></div>','','pause');
  }else if(G.state==='paused'){
    hideScreen();G.state='play';
  }
}

scr.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled)return;
  audioInit();sfx.click();
  const act=b.dataset.act,v=b.dataset.v;
  switch(act){
    case 'new':pending.arc=null;pending.cls=null;screenArc();break;
    case 'continue':continueGame();break;
    case 'arc':pending.arc=v;screenClass();break;
    case 'cls':pending.cls=v;screenClass();break;
    case 'begin':if(pending.arc&&pending.cls)newGame();break;
    case 'tab':campTab=v;renderCamp();break;
    case 'go':startStage(+v);break;
    case 'learn':learn(v);break;
    case 'forge':forge(v);break;
    case 'equip':S.equip=S.equip===v?null:v;refreshStats();saveGame();renderCamp();break;
    case 'switch':S.cls=v;refreshStats();saveGame();renderCamp();break;
    case 'camp':goCamp();break;
    case 'resume':hideScreen();G.state='play';break;
    case 'quit':goCamp();break;
  }
});

/* ---------- hud ---------- */
const hudCache={};
function setTxt(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v;}}
function setStyle(el,key,v){if(hudCache[key]!==v){hudCache[key]=v;el.style.transform=v;}}
const hpFill=$('hpBar').firstElementChild,xpFill=$('xpBar').firstElementChild,bossFill=$('bossFill');
function updateHUD(){
  if(!P||!ST||!LV)return;
  setTxt('hHp',Math.max(0,Math.ceil(P.hp))+'/'+ST.maxHp);
  setTxt('hLv','Lv '+S.lvl);setTxt('hGold',String(S.gold));setTxt('hPot',String(S.potions));
  setStyle(hpFill,'hp','scaleX('+clamp(P.hp/ST.maxHp,0,1).toFixed(3)+')');
  setStyle(xpFill,'xp','scaleX('+clamp(S.xp/xpNeed(S.lvl),0,1).toFixed(3)+')');
  const sk=clamp(P.skillCd/ST.skillCd,0,1).toFixed(2);
  if(hudCache.sk!==sk){hudCache.sk=sk;$('bSkill').style.setProperty('--cd',sk);}
  let pc='0';
  if(CMP)pc=clamp(P.petCd/(PETS[CMP.id].cd*ST.petCd),0,1).toFixed(2);
  if(hudCache.pc!==pc){hudCache.pc=pc;$('bPet').style.setProperty('--cd',pc);}
  const has=!!CMP;
  if(hudCache.has!==has){hudCache.has=has;$('bPet').classList.toggle('none',!has);}
  const a=LV.arena,b=a&&a.boss;
  const showBoss=!!(b&&a.triggered&&!b.dead&&b.state!=='intro');
  if(hudCache.sb!==showBoss){hudCache.sb=showBoss;$('boss').hidden=!showBoss;if(showBoss)$('bossName').textContent=b.name;}
  if(showBoss)setStyle(bossFill,'bh','scaleX('+clamp(b.hp/b.maxHp,0,1).toFixed(3)+')');
}

/* ---------- buttons and keys ---------- */
$('bPause').addEventListener('click',e=>{e.currentTarget.blur();audioInit();togglePause();});
$('bPot').addEventListener('click',e=>{e.currentTarget.blur();audioInit();if(G.state==='play')edge.potion=true;});
$('bSound').addEventListener('click',e=>{
  e.currentTarget.blur();audioInit();
  muted=!muted;lsSet('shardfall.muted',muted);
  e.currentTarget.classList.toggle('off',muted);
  if(!muted)sfx.check();
});
$('bSound').classList.toggle('off',muted);
document.addEventListener('keydown',e=>{
  audioInit();
  if(G.state==='talk'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();advance();return;}
  const k=KM[e.code];
  if(k&&G.state==='play'){
    e.preventDefault();
    if(!keys[k]){keys[k]=true;pressEdge(k);syncInput();}
  }else if(e.code==='KeyQ'&&G.state==='play'){edge.potion=true;}
  else if(e.code==='KeyP'||e.code==='Escape'){if(G.state==='play'||G.state==='paused')togglePause();}
});
document.addEventListener('keyup',e=>{const k=KM[e.code];if(k){keys[k]=false;syncInput();}});
document.addEventListener('touchmove',e=>{if(!(e.target.closest&&e.target.closest('.scroll')))e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')togglePause();});
window.addEventListener('blur',()=>{if(G.state==='play')togglePause();});

/* ---------- main loop ---------- */
let last=0,acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000||0));
  last=ts;G.anim+=dt;
  if(LV&&P&&(G.state==='play'||G.state==='dying')){
    acc+=dt;
    let n=0;
    while(acc>=STEP&&n<8){
      if(G.state==='play')worldStep(STEP);
      else if(G.state==='dying'){G.timer-=STEP;if(G.timer<=0)respawn();}
      acc-=STEP;n++;
    }
    if(n>=8)acc=0;
  }
  if(LV&&P&&G.state!=='paused'&&G.state!=='menu'&&G.state!=='title')auxStep(dt);
  if(scene.typing){
    scene.pos+=dt*55;
    const n=Math.floor(scene.pos);
    $('dText').textContent=scene.full.slice(0,n);
    if(n>=scene.full.length)scene.typing=false;
  }
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt);
  updateCamera(dt);
  if(!$('hud').hidden)updateHUD();
  draw();
}

if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
if(window.__SF_TEST){
  window.__SF_TEST.api={G,input,keys,edge,get S(){return S;},get P(){return P;},get LV(){return LV;},get CMP(){return CMP;},get ST(){return ST;},
    worldStep,startStage,goCamp,runScene,advance,genStage,computeStats,damageEnemy,petCommand,doSkill,doAttack,givePet,openChest,mkEnemy,hurtPlayer,newSave,setS:v=>{S=v;G.arc=v.arc;ST=computeStats();},setP:v=>{P=v;},refreshStats,gainXp,respawn,playerDie,renderCamp,screenClass,screenArc};
}
resize();
screenTitle();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
