<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fractured Path">
<meta name="theme-color" content="#0d0b1a">
<meta name="description" content="The Fractured Path: a pocket fantasy RPG. Choose the hero or the villain, gather creatures, and walk a broken road.">
<title>The Fractured Path</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="screenwrap">
    <canvas id="view" aria-label="The Fractured Path game screen"></canvas>
    <div id="ui"></div>
  </div>
  <div id="dpadwrap">
    <div id="dpad">
      <button class="db up" data-k="up" aria-label="Up"></button>
      <button class="db left" data-k="left" aria-label="Left"></button>
      <button class="db right" data-k="right" aria-label="Right"></button>
      <button class="db down" data-k="down" aria-label="Down"></button>
      <div class="dcenter"></div>
    </div>
  </div>
  <div id="midwrap">
    <button class="mb" data-k="menu" aria-label="Menu">MENU</button>
    <button class="mb" data-k="mute" aria-label="Sound">SOUND</button>
  </div>
  <div id="abwrap">
    <button class="ab b" data-k="b" aria-label="B button">B</button>
    <button class="ab a" data-k="a" aria-label="A button">A</button>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/music.js"></script>
<script src="js/art.js"></script>
<script src="js/arthd.js"></script>
<script src="js/sprites.js"></script>
<script src="js/charhd.js"></script>
<script src="js/data.js"></script>
<script src="js/classes.js"></script>
<script src="js/sprdata.js"></script>
<script src="js/spr.js"></script>
<script src="js/atlas.js"></script>
<script src="js/maps.js"></script>
<script src="js/world.js"></script>
<script src="js/ui.js"></script>
<script src="js/field.js"></script>
<script src="js/battle.js"></script>
<script src="js/menus.js"></script>
<script src="js/story.js"></script>
<script src="js/main.js"></script>
<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
</body>
</html>
