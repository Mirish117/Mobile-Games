name: Rename Echos folder

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Rename and save
        run: |
          test -d Echos_of_Light_Assets
          test ! -e Echos_of_Light
          git mv Echos_of_Light_Assets Echos_of_Light
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename Echos of Light folder"
          git push origin HEAD:main
